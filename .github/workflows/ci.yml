name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COPILOT_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot
      # Fake providers: ingestion/RAG tests exercise the real pipeline
      # without requiring real Groq/Gemini/OpenAI API keys or network
      # access in CI. tests/rag_eval's golden-dataset harness self-skips
      # when real provider keys aren't configured — see its module
      # docstring.
      COPILOT_EMBEDDING_PROVIDER: fake
      COPILOT_LLM_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Type check
        run: mypy app

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
